{{ $image := resources.Get (.Get "src") }}
{{ if eq $image.MediaType.SubType "svg" }}
  <img src="{{ $image.RelPermalink }}" alt="{{ .Get "alt" }}" style="width:100%;height:auto;">
{{ else }}
  {{ $image = $image.Resize "x400" }}
  <img src="{{ $image.RelPermalink }}" width="{{ $image.Width }}" height="{{ $image.Height }}" alt="{{ .Get "alt" }}">
{{ end }}
